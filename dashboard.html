<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Dashboard</title>

  <link rel="stylesheet"
        href="css/dashboard.css">

</head>

<body>

<!-- MOBILE TOPBAR -->

<div class="mobile-topbar">

  <button class="menu-btn"
          onclick="toggleSidebar()">

    ☰

  </button>

  <h2>Sheet Learning</h2>

</div>

<!-- SIDEBAR -->

<div class="sidebar"
     id="sidebar">

  <div class="logo">

    Sheet Learning

  </div>

  <div class="menu">

    <a href="#">
      Dashboard
    </a>

    <a href="#">
      Subjects
    </a>

    <a href="#">
      Favorites
    </a>

    <a href="#">
      Announcements
    </a>

    <a href="#">
      Admin
    </a>

    <a href="#"
       onclick="logout()">

      Logout
    </a>

  </div>

</div>

<!-- MAIN -->

<div class="main">

  <!-- HEADER -->

  <div class="header">

    <div>

      <h1>
        Dashboard
      </h1>

      <p>
        Welcome Back
      </p>

    </div>

    <div class="profile">

      A2 User

    </div>

  </div>

  <!-- SEARCH -->

  <div class="search-box">

    <input type="text"
           placeholder="Search files...">

  </div>

  <!-- STATS -->

  <div class="stats-grid">

    <div class="card">

      <h3>
        Files
      </h3>

      <p>
        124
      </p>

    </div>

    <div class="card">

      <h3>
        Downloads
      </h3>

      <p>
        1,245
      </p>

    </div>

    <div class="card">

      <h3>
        Subjects
      </h3>

      <p>
        14
      </p>

    </div>

  </div>

  <!-- RECENT FILES -->

  <div class="recent-section">

    <h2>
      Recent Files
    </h2>

    <div class="file-grid">

      <div class="file-card">

        <h3>
          Calculus Midterm
        </h3>

        <p>
          PDF File
        </p>

        <button>
          Open
        </button>

      </div>

      <div class="file-card">

        <h3>
          Physics Lecture
        </h3>

        <p>
          PDF File
        </p>

        <button>
          Open
        </button>

      </div>

      <div class="file-card">

        <h3>
          Chemistry Notes
        </h3>

        <p>
          PDF File
        </p>

        <button>
          Open
        </button>

      </div>

    </div>

  </div>

</div>

<script src="js/dashboard.js"></script>

</body>
</html>
