<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ChemHub — สาย A</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0a0e17;
  --surface: #111722;
  --surface2: #1a2235;
  --surface3: #232d42;
  --border: #2a3550;
  --border2: #36445a;
  --accent: #003d99;
  --accent2: #0052cc;
  --accent3: #4d7cff;
  --accent4: #99bbff;
  --teal: #00b8a0;
  --gold: #f5b441;
  --text: #f0f2f8;
  --muted: #7a8299;
  --muted2: #9099a8;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{background:linear-gradient(135deg,var(--bg) 0%,#0d1420 100%);color:var(--text);font-family:'Sarabun',sans-serif;min-height:100vh;position:relative;overflow-x:hidden;}

body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 90% 70% at 15% 20%,rgba(0,82,204,.15) 0%,transparent 50%),radial-gradient(ellipse 70% 60% at 85% 80%,rgba(0,184,160,.08) 0%,transparent 55%);}

.screen{display:none;min-height:100vh;}
.screen.active{display:flex;}

/* ──LOGIN── */
#loginScreen{flex-direction:column;align-items:center;justify-content:center;padding:2rem;position:relative;z-index:1;}

.login-brand{text-align:center;margin-bottom:3rem;}
.login-logo{font-family:'DM Mono',monospace;font-size:1.8rem;font-weight:700;letter-spacing:-.04em;color:var(--text);}
.login-logo span{color:var(--accent4);}
.login-tag{font-size:.9rem;color:var(--muted);margin-top:.4rem;font-family:'Noto Serif Thai',serif;}

.roles{display:flex;gap:1.2rem;margin-bottom:2.5rem;flex-wrap:wrap;justify-content:center;}
.role-btn{width:170px;padding:1.5rem;border-radius:16px;border:2px solid var(--border2);background:var(--surface);cursor:pointer;text-align:center;transition:all .22s;box-shadow:0 4px 20px rgba(0,0,0,.3);}
.role-btn:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,0,0,.4);}
.role-btn.sel-senior{border-color:var(--accent2);background:rgba(0,82,204,.15);}
.role-btn.sel-junior{border-color:var(--gold);background:rgba(245,180,65,.12);}
.role-icon{font-size:2.2rem;margin-bottom:.6rem;}
.role-label{font-weight:700;font-size:1rem;}
.role-sub{font-size:.8rem;color:var(--muted);margin-top:.25rem;}

.login-box{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:2.2rem;width:100%;max-width:400px;box-shadow:0 12px 48px rgba(0,0,0,.45);}
.login-box h2{font-family:'Noto Serif Thai',serif;font-size:1.25rem;margin-bottom:1.6rem;color:var(--text);}

.fg{margin-bottom:1.15rem;}
.fl{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:.45rem;letter-spacing:.06em;}
.fi{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:.7rem 1.1rem;font-family:'Sarabun',sans-serif;font-size:.96rem;color:var(--text);outline:none;transition:all .2s;}
.fi:focus{border-color:var(--accent2);box-shadow:0 0 0 4px rgba(0,82,204,.15);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.65rem 1.4rem;border-radius:11px;font-family:'Sarabun',sans-serif;font-size:.92rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;}
.btn-primary{background:linear-gradient(135deg,var(--accent2),#0041a3);color:#fff;width:100%;box-shadow:0 0 20px rgba(0,82,204,.4);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 32px rgba(0,82,204,.6);}
.btn-primary:disabled{background:var(--border);color:var(--muted);transform:none;cursor:not-allowed;}
.btn-gold{background:linear-gradient(135deg,var(--gold),#c89030);color:#fff;width:100%;box-shadow:0 0 20px rgba(245,180,65,.35);}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 0 32px rgba(245,180,65,.5);}

.err{margin-top:.75rem;padding:.65rem 1rem;background:rgba(214,98,98,.1);border:1px solid rgba(214,98,98,.35);border-radius:9px;font-size:.85rem;color:#d66262;display:none;}
.err.show{display:block;}

/* ──APP── */
#appScreen{flex-direction:column;}

nav{position:sticky;top:0;z-index:100;background:rgba(10,14,23,.92);backdrop-filter:blur(20px) saturate(1.8);border-bottom:1px solid var(--border);padding:0 2rem;height:64px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 32px rgba(0,0,0,.3);}

.nav-left{display:flex;align-items:center;gap:1.2rem;}
.logo{display:flex;align-items:center;gap:.7rem;}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--accent2),var(--accent3));border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:0 0 24px rgba(0,82,204,.5);}
.logo-text{font-family:'DM Mono',monospace;font-size:1.1rem;font-weight:700;letter-spacing:-.03em;color:var(--text);}
.logo-text span{color:var(--accent4);}
.nav-badge{font-size:.7rem;letter-spacing:.08em;background:rgba(0,82,204,.15);border:1px solid rgba(0,82,204,.4);color:var(--accent4);padding:.25rem .8rem;border-radius:99px;}
.nav-right{display:flex;align-items:center;gap:.75rem;}
.nav-user{font-size:.85rem;color:var(--muted);}

.readonly-bar{background:rgba(245,180,65,.12);border-bottom:1px solid #e8d5a0;padding:.55rem 2rem;font-size:.82rem;color:var(--gold);display:flex;align-items:center;gap:.5rem;font-weight:600;z-index:99;}

.app-body{flex:1;max-width:1050px;margin:0 auto;width:100%;padding:2rem;position:relative;z-index:1;}

.search-wrap{display:flex;align-items:center;gap:.8rem;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:.85rem 1.3rem;margin-bottom:2rem;box-shadow:0 4px 24px rgba(0,0,0,.35);transition:all .25s;}
.search-wrap:focus-within{border-color:var(--accent2);box-shadow:0 0 0 4px rgba(0,82,204,.15),0 4px 24px rgba(0,0,0,.35);}
.search-wrap svg{color:var(--muted);flex-shrink:0;}
.search-wrap input{flex:1;background:transparent;border:none;outline:none;font-family:'Sarabun',sans-serif;font-size:.97rem;color:var(--text);}
.search-wrap input::placeholder{color:var(--muted);}

.tabs{display:flex;gap:.55rem;flex-wrap:wrap;margin-bottom:2rem;}
.tab{padding:.5rem 1.3rem;border-radius:11px;border:1.5px solid var(--border2);background:var(--surface);color:var(--muted2);font-size:.9rem;font-weight:500;cursor:pointer;transition:all .18s;}
.tab:hover{border-color:var(--accent3);color:var(--accent3);}
.tab.active{color:#fff;font-weight:700;border:none;background:linear-gradient(135deg,var(--accent2),#0041a3);box-shadow:0 0 16px rgba(0,82,204,.5);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:1.15rem;}

.card{background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);border:1px solid var(--border);border-radius:16px;padding:1.4rem;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;inset:0;border-radius:16px;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at 30% 30%,rgba(0,82,204,.1) 0%,transparent 70%);}
.card:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.4);}
.card:hover::before{opacity:1;}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1rem;}
.card-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;}
.card-code{font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.08em;color:var(--muted);background:var(--surface2);border:1px solid var(--border);padding:.2rem .65rem;border-radius:7px;}
.card-name{font-size:.99rem;font-weight:700;line-height:1.45;margin-bottom:.8rem;}
.card-desc{font-size:.82rem;color:var(--muted2);line-height:1.6;margin-bottom:.9rem;}
.card-footer{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;}
.pill{display:flex;align-items:center;gap:.35rem;font-size:.74rem;color:var(--muted2);background:var(--surface2);border:1px solid var(--border);padding:.22rem .7rem;border-radius:99px;}

.empty{grid-column:1/-1;text-align:center;padding:3rem 1.5rem;color:var(--muted);}
.empty-icon{font-size:2.2rem;margin-bottom:.7rem;}

.overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(10,14,23,.8);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:1.5rem;}
.overlay.open{display:flex;animation:fdIn .18s;}
@keyframes fdIn{from{opacity:0}to{opacity:1}}

.modal{background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);border:1px solid var(--border2);border-radius:20px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.55);animation:slUp .22s ease;}
@keyframes slUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}

.modal-head{padding:1.6rem 1.6rem 1.2rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:1.2rem;}
.modal-tag{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);letter-spacing:.12em;margin-bottom:.35rem;}
.modal-title{font-size:1.15rem;font-weight:700;}
.modal-close{background:var(--surface2);border:1px solid var(--border);border-radius:9px;width:32px;height:32px;color:var(--muted);cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.modal-close:hover{background:var(--border);color:var(--text);}
.modal-body{padding:1.6rem;}
.modal-foot{padding:1.1rem 1.6rem;border-top:1px solid var(--border);display:flex;gap:.75rem;justify-content:flex-end;}

.dmodal{background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);border:1px solid var(--border2);border-radius:20px;width:100%;max-width:620px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.55);animation:slUp .22s ease;}
.dtop{padding:1.8rem 1.6rem 1.4rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:1.2rem;position:relative;}
.dinfo{flex:1;}
.d-icon{font-size:2.4rem;margin-bottom:.7rem;}
.d-code{font-family:'DM Mono',monospace;font-size:.73rem;color:var(--muted);margin-bottom:.4rem;}
.d-title{font-family:'Noto Serif Thai',serif;font-size:1.5rem;font-weight:700;margin-bottom:.4rem;}
.d-desc{font-size:.9rem;color:var(--muted2);line-height:1.7;}

.dsec{padding:1.3rem 1.6rem;border-bottom:1px solid var(--border);}
.dsec-label{font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:.9rem;}

.res-list{display:flex;flex-direction:column;gap:.5rem;}
.res-item{display:flex;align-items:center;gap:.7rem;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:.65rem 1rem;transition:all .18s;}
.res-item:hover{border-color:var(--border2);background:var(--surface3);}
.res-a{display:flex;align-items:center;gap:.7rem;flex:1;text-decoration:none;color:var(--text);}
.res-icon{font-size:1rem;flex-shrink:0;}
.res-name{flex:1;font-size:.9rem;}
.res-type{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:.15rem .55rem;border-radius:6px;}
.res-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;padding:.15rem;transition:color .15s;}
.res-del:hover{color:#d66262;}

.add-row{display:flex;gap:.5rem;margin-top:.9rem;flex-wrap:wrap;}
.add-row .fi{flex:2;min-width:100px;}
.add-row .fs{flex:1;min-width:80px;}

.toast{position:fixed;bottom:2rem;right:2rem;z-index:999;background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:.75rem 1.3rem;font-size:.9rem;color:var(--text);display:flex;align-items:center;gap:.6rem;transform:translateY(16px);opacity:0;transition:all .28s;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.45);}
.toast.show{transform:translateY(0);opacity:1;}

@media(max-width:640px){
  nav,.app-body{padding-left:1.2rem;padding-right:1.2rem;}
  .grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="screen active" id="loginScreen">
  <div class="login-brand">
    <div class="login-logo">Chem<span>Hub</span></div>
    <div class="login-tag">🔬 คณะวิทยาศาสตร์ เคมี สาย A</div>
  </div>

  <div class="roles">
    <button class="role-btn" onclick="selectRole('senior')">
      <div class="role-icon">👨‍🏫</div>
      <div class="role-label">รุ่นพี่</div>
      <div class="role-sub">แก้ไขข้อมูล</div>
    </button>
    <button class="role-btn" onclick="selectRole('junior')">
      <div class="role-icon">👨‍🎓</div>
      <div class="role-label">รุ่นน้อง</div>
      <div class="role-sub">ดูอย่างเดียว</div>
    </button>
  </div>

  <div class="login-box">
    <h2 id="title">เลือกบทบาทก่อนเข้าสู่ระบบ</h2>

    <div id="seniorForm" style="display:none">
      <div class="fg">
        <label class="fl">USERNAME</label>
        <input class="fi" id="l_user" placeholder="ชื่อผู้ใช้" autocomplete="username"/>
      </div>
      <div class="fg">
        <label class="fl">PASSWORD</label>
        <input class="fi" id="l_pass" type="password" placeholder="รหัสผ่าน" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">เข้าสู่ระบบ</button>
    </div>

    <div id="juniorForm" style="display:none">
      <div class="fg">
        <label class="fl">รหัสผ่านรุ่น</label>
        <input class="fi" id="l_jpass" type="password" placeholder="รหัสผ่านสำหรับรุ่นน้อง" onkeydown="if(event.key==='Enter')doLoginJunior()"/>
      </div>
      <button class="btn btn-gold" onclick="doLoginJunior()">เข้าดูข้อมูล</button>
    </div>

    <div class="err" id="err"></div>
  </div>
</div>

<div class="screen" id="appScreen">
  <div class="readonly-bar" id="roBar" style="display:none">
    👀 โหมดอ่านอย่างเดียว — คุณสามารถดูข้อมูลและลิงก์ไฟล์ได้เท่านั้น
  </div>

  <nav>
    <div class="nav-left">
      <div class="logo">
        <div class="logo-icon">⚗️</div>
        <div class="logo-text">Chem<span>Hub</span></div>
      </div>
      <div class="nav-badge" id="badge"></div>
    </div>
    <div class="nav-right">
      <span class="nav-user" id="user"></span>
      <button class="btn" style="background:transparent;border:1px solid var(--border2);color:var(--muted2);padding:.4rem 1rem;font-size:.85rem" onclick="logout()">ออกจาก</button>
    </div>
  </nav>

  <div class="app-body">
    <div class="search-wrap">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="srch" placeholder="ค้นหาวิชา หรือรหัสวิชา…" oninput="render()"/>
    </div>

    <div class="tabs">
      <button class="tab active" data-y="all" onclick="switchTab('all',this)">🔬 ทุกชั้นปี</button>
      <button class="tab" data-y="1" onclick="switchTab('1',this)">ปี 1</button>
      <button class="tab" data-y="2" onclick="switchTab('2',this)">ปี 2</button>
      <button class="tab" data-y="3" onclick="switchTab('3',this)">ปี 3</button>
      <button class="tab" data-y="4" onclick="switchTab('4',this)">ปี 4</button>
    </div>

    <div class="grid" id="main"></div>
  </div>
</div>

<div class="overlay" id="addOverlay">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="modal-tag" id="mTag">NEW COURSE</div>
        <div class="modal-title" id="mTitle">เพิ่มวิชาใหม่</div>
      </div>
      <button class="modal-close" onclick="close2('addOverlay')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="f_id"/>
      <div style="display:flex;gap:.85rem">
        <div class="fg" style="flex:1">
          <label class="fl">รหัสวิชา</label>
          <input class="fi" id="f_code" placeholder="CH101"/>
        </div>
        <div class="fg" style="flex:2">
          <label class="fl">ชื่อวิชา</label>
          <input class="fi" id="f_name" placeholder="General Chemistry"/>
        </div>
      </div>
      <div class="fg">
        <label class="fl">คำอธิบาย</label>
        <textarea class="fi" id="f_desc" placeholder="อธิบายเนื้อหาย่อๆ…" style="min-height:70px;resize:vertical;font-family:'Sarabun',sans-serif"></textarea>
      </div>
      <div style="display:flex;gap:.85rem">
        <div class="fg" style="flex:1">
          <label class="fl">ชั้นปี</label>
          <select class="fi" id="f_year" style="padding:.7rem 1.1rem">
            <option value="1">ปี 1</option>
            <option value="2">ปี 2</option>
            <option value="3">ปี 3</option>
            <option value="4">ปี 4</option>
          </select>
        </div>
        <div class="fg" style="flex:1">
          <label class="fl">หน่วยกิต</label>
          <input class="fi" id="f_credits" type="number" value="3" min="1" max="9"/>
        </div>
      </div>
      <div class="fg">
        <label class="fl">ไอคอน</label>
        <div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem" id="emojiRow"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="close2('addOverlay')">ยกเลิก</button>
      <button class="btn btn-primary" onclick="saveCourse()">บันทึก</button>
    </div>
  </div>
</div>

<div class="overlay" id="detailOverlay">
  <div class="dmodal" id="detailInner"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyM6G8tEILpPi9E3FP-Uzh1HIoD20L6JSKu4TIWY4e3SwG-itvQJvqgf-rpJodzFQRd/exec';
const EMOJIS = ['⚗️','🔬','🧪','🧫','🧬','💊','🔭','📐','🧮','💻','📘','📙','📊','🌡️','⚛️','🫧'];
const YC = {1:'var(--y1)',2:'var(--y2)',3:'var(--y3)',4:'var(--y4)'};
const YN = {1:'ชั้นปีที่ 1',2:'ชั้นปีที่ 2',3:'ชั้นปีที่ 3',4:'ชั้นปีที่ 4'};
const YG = {1:'🧪',2:'⚗️',3:'🔬',4:'🎓'};
const TI = {PDF:'📄',SLIDE:'🖼️',EXERCISE:'✏️',LINK:'🔗',VIDEO:'🎬',NOTE:'📝'};

let session = null, courses = [], selEmoji = '⚗️', activeTab = 'all';

function apiCall(p) {
  return new Promise((r, j) => {
    const cb = 'cb_' + Math.random().toString(36).slice(2);
    const qs = Object.entries({...p,callback:cb}).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&');
    const s = document.createElement('script');
    s.src = API + '?' + qs;
    window[cb] = (d) => { delete window[cb]; s.remove(); r(d); };
    s.onerror = () => { delete window[cb]; s.remove(); j(); };
    document.head.appendChild(s);
  });
}

let selectedRole = null;
function selectRole(r) {
  selectedRole = r;
  document.querySelectorAll('.role-btn').forEach(b => b.className='role-btn');
  if(r==='senior') document.querySelector('.role-btn:nth-child(1)').className='role-btn sel-senior';
  else document.querySelector('.role-btn:nth-child(2)').className='role-btn sel-junior';
  document.getElementById('seniorForm').style.display = r==='senior'?'block':'none';
  document.getElementById('juniorForm').style.display = r==='junior'?'block':'none';
  document.getElementById('title').textContent = r==='senior'?'เข้าสู่ระบบ — รุ่นพี่':'เข้าสู่ระบบ — รุ่นน้อง';
  document.getElementById('err').className='err';
}

async function doLogin() {
  const u = document.getElementById('l_user').value.trim();
  const p = document.getElementById('l_pass').value;
  if(!u||!p) { showErr('กรุณากรอก username และ password'); return; }
  setLoading(true);
  try {
    const res = await apiCall({action:'login',role:'senior',username:u,password:p});
    if(res.ok) enterApp({role:'senior',username:res.username||u});
    else showErr('Username หรือ Password ไม่ถูกต้อง');
  } catch { showErr('เชื่อมต่อไม่ได้'); }
  setLoading(false);
}

async function doLoginJunior() {
  const p = document.getElementById('l_jpass').value;
  if(!p) { showErr('กรุณากรอกรหัสผ่าน'); return; }
  setLoading(true);
  try {
    const res = await apiCall({action:'login',role:'junior',password:p});
    if(res.ok) enterApp({role:'junior',username:'น้องนักศึกษา'});
    else showErr('รหัสผ่านไม่ถูกต้อง');
  } catch { showErr('เชื่อมต่อไม่ได้'); }
  setLoading(false);
}

function showErr(m) { const e = document.getElementById('err'); e.textContent=m; e.className='err show'; }
function setLoading(on) {
  ['loginBtn'].forEach(id => {
    const b = document.getElementById(id);
    if(b) { b.disabled=on; b.textContent=on?'กำลังตรวจสอบ...':'เข้าสู่ระบบ'; }
  });
}

async function enterApp(s) {
  session = s;
  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('appScreen').classList.add('active');
  const b = document.getElementById('badge');
  if(s.role==='senior') { b.className='nav-badge'; b.textContent='รุ่นพี่'; }
  else { b.className='nav-badge'; b.textContent='รุ่นน้อง'; b.style.borderColor='rgba(245,180,65,.4)'; b.style.background='rgba(245,180,65,.15)'; b.style.color='var(--gold)'; }
  document.getElementById('user').textContent = s.username;
  document.getElementById('roBar').style.display = s.role==='junior'?'flex':'none';
  const btn = document.querySelector('nav .btn');
  if(btn) { if(s.role==='senior') btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg> เพิ่มวิชา'; }
  await loadCourses();
}

function logout() {
  session = null; courses = [];
  document.getElementById('appScreen').classList.remove('active');
  document.getElementById('loginScreen').classList.add('active');
  ['l_user','l_pass','l_jpass','srch'].forEach(id => document.getElementById(id).value='');
  selectedRole = null;
  document.querySelectorAll('.role-btn').forEach(b => b.className='role-btn');
  document.getElementById('seniorForm').style.display='none';
  document.getElementById('juniorForm').style.display='none';
  document.getElementById('title').textContent='เลือกบทบาทก่อนเข้าสู่ระบบ';
}

async function loadCourses() {
  document.getElementById('main').innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--muted)">กำลังโหลด…</div>`;
  try {
    const res = await apiCall({action:'getCourses'});
    courses = (res.courses||[]).map(c => ({...c,resources:(() => {try{return JSON.parse(c.resources||'[]')}catch{return[]}}())}));
    render();
  } catch {
    document.getElementById('main').innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--muted)">⚠️ โหลดไม่ได้</div>`;
  }
}

function switchTab(y, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active'); activeTab = y; render();
}

function render() {
  const q = document.getElementById('srch').value.toLowerCase();
  let html = '';
  [1,2,3,4].forEach(y => {
    if(activeTab!=='all' && activeTab!==String(y)) return;
    let list = courses.filter(c => String(c.year)===String(y));
    if(q) list = list.filter(c => c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q));
    if(q && !list.length) return;

    html += `<div style="grid-column:1/-1;margin-top:${y===1?0:'1.5rem'}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;padding-bottom:.8rem;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:.8rem">
          <div style="width:40px;height:40px;border-radius:12px;background:rgba(0,82,204,.15);display:flex;align-items:center;justify-content:center;font-size:1.15rem">${YG[y]}</div>
          <div style="font-family:'Noto Serif Thai',serif;font-size:1.2rem;font-weight:700">${YN[y]}</div>
          <div style="font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);background:var(--surface2);border:1px solid var(--border);padding:.2rem .7rem;border-radius:99px">${list.length}</div>
        </div>
        ${session?.role==='senior'?`<button class="btn" style="background:transparent;border:1px solid var(--border2);color:var(--muted2);padding:.4rem 1rem;font-size:.85rem" onclick="openAdd('${y}')">+ เพิ่มวิชา</button>`:''}
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:1.15rem">`;

    if(!list.length) {
      html += `<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--muted)"><div style="font-size:1.8rem;margin-bottom:.5rem">🧫</div><p>ยังไม่มีวิชาในชั้นปีนี้</p></div>`;
    } else {
      list.forEach(c => {
        html += `<div class="card" onclick="openDetail('${c.id}')">
          <div class="card-top">
            <div class="card-icon" style="background:rgba(0,82,204,.15)">${c.icon||'📘'}</div>
            <div class="card-code">${c.code}</div>
          </div>
          <div class="card-name">${c.name}</div>
          ${c.desc?`<div class="card-desc">${c.desc}</div>`:''}
          <div class="card-footer">
            <div class="pill">📁 ${(c.resources||[]).length}</div>
            <div class="pill">⭐ ${c.credits}</div>
          </div>
        </div>`;
      });
    }
    html += `</div></div>`;
  });

  if(!html) html = `<div style="grid-column:1/-1;text-align:center;padding:4rem;color:var(--muted)"><div style="font-size:2rem;margin-bottom:.5rem">🔍</div><p>ไม่พบวิชาที่ค้นหา</p></div>`;
  document.getElementById('main').innerHTML = html;
}

function buildEmoji() {
  document.getElementById('emojiRow').innerHTML = EMOJIS.map(e => 
    `<button style="width:36px;height:36px;border-radius:9px;background:var(--surface2);border:1.5px solid var(--border);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;${e===selEmoji?'border-color:var(--accent2);background:rgba(0,82,204,.18)':''}" class="${e===selEmoji?'sel':''}" onclick="pickE('${e}',this)">${e}</button>`
  ).join('');
}
function pickE(e, el) {
  selEmoji = e;
  document.querySelectorAll('#emojiRow button').forEach(b => b.className='');
  el.className='sel';
}

function openAdd(year='1') {
  document.getElementById('mTag').textContent='NEW COURSE';
  document.getElementById('mTitle').textContent='เพิ่มวิชาใหม่';
  document.getElementById('f_id').value='';
  ['f_code','f_name','f_desc'].forEach(id => document.getElementById(id).value='');
  document.getElementById('f_year').value=year;
  document.getElementById('f_credits').value=3;
  selEmoji='⚗️'; buildEmoji();
  open2('addOverlay');
}

function openEdit(id) {
  const c = courses.find(x => x.id===id); if(!c) return;
  document.getElementById('mTag').textContent='EDIT COURSE';
  document.getElementById('mTitle').textContent='แก้ไขวิชา';
  document.getElementById('f_id').value=c.id;
  document.getElementById('f_code').value=c.code;
  document.getElementById('f_name').value=c.name;
  document.getElementById('f_desc').value=c.desc||'';
  document.getElementById('f_year').value=c.year;
  document.getElementById('f_credits').value=c.credits;
  selEmoji=c.icon||'⚗️'; buildEmoji();
  close2('detailOverlay'); open2('addOverlay');
}

async function saveCourse() {
  const code = document.getElementById('f_code').value.trim();
  const name = document.getElementById('f_name').value.trim();
  if(!code||!name) { toast('⚠️ กรุณากรอกรหัสและชื่อวิชา'); return; }
  const eid = document.getElementById('f_id').value;
  const id = eid || 'c_'+Date.now();
  const existing = courses.find(c => c.id===eid);
  const course = {id,code,name,desc:document.getElementById('f_desc').value.trim(),year:document.getElementById('f_year').value,credits:document.getElementById('f_credits').value,icon:selEmoji,resources:JSON.stringify(existing?.resources||[])};
  try {
    await apiCall({action:'saveCourse',course:JSON.stringify(course)});
    await loadCourses();
    close2('addOverlay');
    toast(eid?'✅ แก้ไขแล้ว':'✅ เพิ่มวิชาแล้ว');
  } catch { toast('❌ บันทึกไม่สำเร็จ'); }
}

function openDetail(id) {
  const c = courses.find(x => x.id===id); if(!c) return;
  renderDetail(c); open2('detailOverlay');
}

function renderDetail(c) {
  const isSr = session?.role==='senior';
  const res = c.resources||[];
  const resHtml = res.length
    ? res.map(r => `
      <div class="res-item">
        <a class="res-a" href="${r.url||'#'}" target="_blank" rel="noopener">
          <span class="res-icon">${TI[r.type]||'📎'}</span>
          <span class="res-name">${r.name}</span>
          <span class="res-type">${r.type}</span>
        </a>
        ${isSr?`<button class="res-del" onclick="delRes('${c.id}','${r.id}')">🗑</button>`:''}
      </div>`).join('')
    : `<div class="empty" style="padding:1.2rem 0"><div class="empty-icon">📭</div><p>${isSr?'ยังไม่มีไฟล์':'ยังไม่มีไฟล์'}</p></div>`;

  const addRow = isSr?`
    <div class="add-row">
      <input class="fi" id="r_name" placeholder="ชื่อไฟล์"/>
      <input class="fi" id="r_url" placeholder="URL"/>
      <select class="fi" id="r_type">
        <option>PDF</option><option>SLIDE</option><option>EXERCISE</option>
        <option>LINK</option><option>VIDEO</option><option>NOTE</option>
      </select>
      <button class="btn btn-primary" style="padding:.42rem .85rem;font-size:.82rem" onclick="addRes('${c.id}')">+ เพิ่ม</button>
    </div>`:'';

  const actions = isSr?`
    <button class="btn" style="background:transparent;border:1px solid var(--border2);color:var(--muted2);padding:.4rem .8rem;font-size:.82rem" onclick="openEdit('${c.id}')">✏️ แก้ไข</button>
    <button class="btn" style="background:transparent;border:1px solid #2a1818;color:#d66262;padding:.4rem .8rem;font-size:.82rem" onclick="delCourse('${c.id}')">🗑 ลบ</button>`:'';

  document.getElementById('detailInner').innerHTML = `
    <div class="dtop" style="background:linear-gradient(135deg,rgba(0,82,204,.08),transparent)">
      <div class="dinfo">
        <div class="d-icon">${c.icon||'📘'}</div>
        <div class="d-code">${c.code} · ปี ${c.year} · ${c.credits} cr.</div>
        <div class="d-title">${c.name}</div>
        ${c.desc?`<div class="d-desc">${c.desc}</div>`:''}
      </div>
      <button class="modal-close" onclick="close2('detailOverlay')">✕</button>
    </div>
    <div class="dsec">
      <div class="dsec-label">ไฟล์และลิงก์</div>
      <div class="res-list">${resHtml}</div>
      ${addRow}
    </div>
    <div class="modal-foot" style="justify-content:space-between">
      <div style="display:flex;gap:.55rem">${actions}</div>
      <button class="btn" style="background:transparent;border:1px solid var(--border2);color:var(--muted2);padding:.4rem .8rem;font-size:.82rem" onclick="close2('detailOverlay')">ปิด</button>
    </div>`;
}

async function addRes(cid) {
  const name = document.getElementById('r_name')?.value.trim();
  const url = document.getElementById('r_url')?.value.trim()||'#';
  const type = document.getElementById('r_type')?.value;
  if(!name) { toast('⚠️ กรุณากรอกชื่อไฟล์'); return; }
  const c = courses.find(x => x.id===cid);
  c.resources.push({id:'r_'+Date.now(),name,url,type});
  try {
    await apiCall({action:'saveCourse',course:JSON.stringify({...c,resources:JSON.stringify(c.resources)})});
    renderDetail(c); render(); toast('✅ เพิ่มไฟล์แล้ว');
  } catch { toast('❌ บันทึกไม่สำเร็จ'); c.resources.pop(); renderDetail(c); }
}

async function delRes(cid, rid) {
  const c = courses.find(x => x.id===cid);
  const prev = [...c.resources];
  c.resources = c.resources.filter(r => r.id!==rid);
  try {
    await apiCall({action:'saveCourse',course:JSON.stringify({...c,resources:JSON.stringify(c.resources)})});
    renderDetail(c); render(); toast('🗑 ลบไฟล์แล้ว');
  } catch { toast('❌ ลบไม่สำเร็จ'); c.resources = prev; renderDetail(c); }
}

async function delCourse(id) {
  if(!confirm('ต้องการลบวิชานี้?')) return;
  close2('detailOverlay');
  try {
    await apiCall({action:'deleteCourse',id});
    await loadCourses();
    toast('🗑 ลบวิชาแล้ว');
  } catch { toast('❌ ลบไม่สำเร็จ'); }
}

function open2(id) { document.getElementById(id).classList.add('open'); }
function close2(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if(e.target===o) o.classList.remove('open'); }));
function toast(m) { const t = document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'),2800); }
</script>
</body>
</html>
