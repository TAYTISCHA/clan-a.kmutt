<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

  <h1>ระบบชีทเรียนสายรหัส</h1>

  <input type="text"
         id="student_id"
         placeholder="รหัสนักศึกษา">

</div>

<script src="js/config.js"></script>
<script src="js/login.js"></script>

</body>
</html>
