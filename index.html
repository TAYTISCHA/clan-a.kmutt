<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChemHub — สาย A</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="screen active" id="loginScreen">
  <div class="login-box">
    <div class="logo">Chem<span>Hub</span></div>
    <p>สืบค้นข้อมูลสายรหัส A</p>
    <div class="fg"><input class="fi" id="l_sid" placeholder="รหัสนักศึกษา"/></div>
    <div class="fg"><input class="fi" id="l_house" placeholder="สายรหัส / บ้าน"/></div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div class="screen" id="appScreen">
  <nav>
    <div class="nav-left"><strong>ChemHub</strong> <span id="roleBadge" class="badge"></span></div>
    <div class="nav-right">
      <span id="userInfo"></span>
      <button class="btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="app-body">
    <div class="toolbar">
      <input type="text" id="srch" placeholder="ค้นหาวิชา..." oninput="render()"/>
      <button id="addBtn" class="btn btn-primary" style="display:none" onclick="openAdd()">+ เพิ่มวิชา</button>
    </div>
    <div class="grid" id="main"></div>
  </div>
</div>

<div class="overlay" id="detailOverlay">
  <div class="modal" id="detailInner"></div>
</div>

<div class="overlay" id="addOverlay">
  <div class="modal">
    <h3>จัดการข้อมูลวิชา</h3>
    <input type="hidden" id="f_id"/>
    <input class="fi" id="f_code" placeholder="รหัสวิชา"/>
    <input class="fi" id="f_name" placeholder="ชื่อวิชา"/>
    <textarea class="fi" id="f_desc" placeholder="รายละเอียด"></textarea>
    <select class="fi" id="f_year">
        <option value="1">ปี 1</option><option value="2">ปี 2</option>
        <option value="3">ปี 3</option><option value="4">ปี 4</option>
    </select>
    <button class="btn btn-primary" onclick="saveCourse()">บันทึก</button>
    <button class="btn" onclick="closeModal('addOverlay')">ยกเลิก</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
