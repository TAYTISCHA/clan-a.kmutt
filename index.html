<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChemHub — สาย A</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="screen active" id="loginScreen">
  <div class="login-brand">
    <div class="login-logo">Chem<span>Hub</span></div>
    <div class="login-tag">🔬 ระบบฐานข้อมูลสายรหัส (สาย A)</div>
  </div>

  <div class="login-box">
    <h2>เข้าสู่ระบบนักศึกษา</h2>
    
    <div class="fg">
      <label class="fl">STUDENT ID</label>
      <input class="fi" id="l_sid" placeholder="ระบุรหัสนักศึกษา" autocomplete="username"/>
    </div>
    <div class="fg">
      <label class="fl">HOUSE / LINE</label>
      <input class="fi" id="l_house" placeholder="ระบุชื่อบ้านหรือสายรหัส" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">เข้าใช้งาน</button>
    
    <div class="err" id="err"></div>
    <p class="session-note">* ระบบอนุญาตให้เข้าใช้งานได้เพียง 1 เครื่องต่อบัญชีเท่านั้น หากมีการเข้าซ้ำเครื่องเก่าจะถูกตัดการเชื่อมต่อ</p>
  </div>
</div>

<div class="screen" id="appScreen">
  <nav>
    <div class="nav-left">
      <div class="logo">
        <div class="logo-icon">⚗️</div>
        <div class="logo-text">Chem<span>Hub</span></div>
      </div>
      <div class="nav-badge" id="badge">Active Session</div>
    </div>
    <div class="nav-right">
      <span class="nav-user" id="user"></span>
      <button class="btn logout-btn" onclick="logout()">ออกจากระบบ</button>
    </div>
  </nav>

  <div class="app-body">
    <div class="search-wrap">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="srch" placeholder="ค้นหาวิชา หรือรหัสวิชา…" oninput="render()"/>
    </div>

    <div class="tabs">
      <button class="tab active" data-y="all" onclick="switchTab('all',this)">🔬 ทุกชั้นปี</button>
      <button class="tab" data-y="1" onclick="switchTab('1',this)">ปี 1</button>
      <button class="tab" data-y="2" onclick="switchTab('2',this)">ปี 2</button>
      <button class="tab" data-y="3" onclick="switchTab('3',this)">ปี 3</button>
      <button class="tab" data-y="4" onclick="switchTab('4',this)">ปี 4</button>
    </div>

    <div class="grid" id="main"></div>
  </div>
</div>

<div class="overlay" id="detailOverlay">
  <div class="dmodal" id="detailInner"></div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
